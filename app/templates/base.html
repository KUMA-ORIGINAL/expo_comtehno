{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ICEE{% endblock %}</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --primary-soft: rgba(37, 99, 235, 0.14);
            --text: #1e3a5f;
            --text-muted: #64748b;
            --border: #c7d7f0;
            --bg: #eef4ff;
        }
        * { box-sizing: border-box; }
        html { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.55;
            color: var(--text);
            background: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        .page-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .lang-bar {
            flex-shrink: 0;
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1rem;
        }
        .lang-bar-inner {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .lang-form { margin: 0; }
        .lang-select {
            padding: 0.35rem 0.55rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            background: #fff;
            color: var(--text);
            cursor: pointer;
        }
        .main {
            padding: 2rem 1.25rem;
            flex: 1 0 auto;
        }
        .btn {
            display: inline-block;
            padding: 0.55rem 1.35rem;
            background: var(--primary);
            color: #fff !important;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn:hover { background: var(--primary-dark); }
        @media (max-width: 992px) {
            .main { padding: 1.5rem 1rem; }
        }
        @media (max-width: 640px) {
            .main { padding: 1.25rem 0.85rem; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="page-shell">
        <div class="lang-bar">
            <div class="lang-bar-inner">
                <form action="{% url 'set_language' %}" method="post" class="lang-form">
                    {% csrf_token %}
                    <input name="next" type="hidden" value="{{ request.get_full_path }}">
                    <select name="language" onchange="this.form.submit()" class="lang-select" aria-label="{% trans 'Язык' %}">
                        {% get_current_language as current_lang %}
                        {% get_available_languages as available_langs %}
                        {% for lang_code, lang_name in available_langs %}
                        <option value="{{ lang_code }}" {% if lang_code == current_lang %}selected{% endif %}>{{ lang_name }}</option>
                        {% endfor %}
                    </select>
                </form>
            </div>
        </div>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
